name: held-out benchmarks

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  heldout:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-heldout')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        shell: bash
        run: pip install -e ".[dev]"
      - name: Reproduce committed baseline
        shell: bash
        run: python -m pytest tests/test_holdout_benchmarks.py -q
      - name: Run held-out suite
        shell: bash
        run: python -m doofus.benchmarks --engine-ref "${{ github.sha }}" --out heldout-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: heldout-report-${{ github.sha }}
          path: heldout-report.json
          if-no-files-found: error
