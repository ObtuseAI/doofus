name: tests

on:
  push:
    branches: [master, doofus-gen1637-postlive-certification-v1]
  pull_request:
    branches: [master, doofus-gen1637-postlive-certification-v1]

# Doofus is a Windows-native project (winreg, schtasks, C:\ paths, PowerShell
# scripts), so CI runs on Windows. bash (Git Bash, preinstalled on the runner)
# is used for the run steps so multi-line commands are portable.
defaults:
  run:
    shell: bash

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No API keys are provided: the system degrades to dry-run without
      # OpenRouter credentials, so the suite must pass without secrets.
      # The deselected tests require pre-existing live-runtime machine state
      # (e.g. a populated metrics DB) or use data-dependent thresholds against
      # the maintainer's local workspace, so they cannot pass on a fresh
      # checkout. See the PR description for detail.
      - name: Run tests
        run: |
          python -m pytest tests/ -q \
            --deselect "tests/test_autonomous_live_runner.py::test_external_stop_mtime_halts_daemon" \
            --deselect "tests/test_init_timeout_containment_baseline.py::test_checkpoint_backup_created" \
            --deselect "tests/test_live_runtime_guard.py::test_dry_run_cycle_does_not_mutate_live_runtime" \
            --deselect "tests/test_self_improvement_catalog.py::test_next_cycle_seeds" \
            --deselect "tests/test_shared_improvement_feed.py::test_main_dry_run_writes_schema"

      - name: Check public-release presentation and hygiene
        run: python scripts/public_release_readiness.py --root . --report "$RUNNER_TEMP/doofus-public-release-readiness.json"

  ruff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Ruff check
        run: ruff check .
